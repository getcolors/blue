[project]
name = "blue"
version = "0.1.0"
description = "blue — the Python/uv workflow SDK of the green/red/blue family: opts->opts steps, DAGs, subworkflows, layered advice, and YAML desired state with a COLORS_PAR_* overlay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
