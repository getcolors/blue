[project]
name = "blue"
version = "0.1.0"
description = "blue — the uv/Python implementation of the green/red workflow model: idempotent devops CLIs from YAML desired state, step-graph workflows, template scaffolding, OpenTofu and Ansible."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
